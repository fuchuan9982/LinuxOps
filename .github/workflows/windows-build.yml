
name: Build LinuxOps Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 下载 GitHub 仓库源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. 使用 Maven 编译项目
      - name: Build application
        shell: pwsh
        run: |
          mvn -B clean package
          if ($LASTEXITCODE -ne 0) { throw 'Maven build failed' }
          if (!(Test-Path 'target/linuxops-1.0.0.jar')) { throw 'Shaded JAR not found' }

      # 4. 使用 jpackage 打包 Windows EXE
      - name: Create Windows portable application
        shell: pwsh
        run: |
          jpackage --type app-image --name LinuxOps --input target --main-jar linuxops-1.0.0.jar --main-class com.linuxops.Main --dest dist
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
          if (!(Test-Path 'dist/LinuxOps/LinuxOps.exe')) { throw 'LinuxOps.exe not found' }

      # 5. 压缩 EXE 应用目录
      - name: Zip portable application
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/LinuxOps/*' -DestinationPath 'LinuxOps-Windows-x64.zip' -Force

      # 6. 上传最终构建文件
      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: LinuxOps-Windows-x64
          path: LinuxOps-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
