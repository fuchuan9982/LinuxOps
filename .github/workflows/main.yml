name: Build Windows Package

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许在网页上手动触发

jobs:
  build:
    runs-on: windows-latest # 关键：必须用 Windows，因为 jpackage 生成的是 Windows 应用

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Package with jpackage
        shell: cmd
        run: |
          jpackage --type app-image --name LinuxOps --input target --main-jar *.jar --main-class your.main.Class

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxOps-Windows-ZIP
          path: LinuxOps/ # 将 jpackage 生成的整个应用目录打包上传
